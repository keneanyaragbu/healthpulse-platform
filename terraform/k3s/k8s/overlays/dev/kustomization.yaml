apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -dev

namespace: healthpulse-dev

resources:
  - ../../base

images:
  - name: keneanyaragbu/healthpulse-backend
    newTag: 57-0a20e6e

patches:
  - target:
      kind: Namespace
      name: healthpulse
    patch: |-
      - op: replace
        path: /metadata/name
        value: healthpulse-dev