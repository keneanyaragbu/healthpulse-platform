apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthpulse-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/keneanyaragbu/healthpulse-platform.git
    targetRevision: develop
    path: terraform/k3s/k8s/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: healthpulse-uat
  syncPolicy:
    syncOptions:
      - CreateNamespace=true